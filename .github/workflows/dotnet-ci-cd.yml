name: 🚀 V-Closet Git-Flow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/*"     # Tự động trigger CI khi thành viên push lên nhánh riêng
      - "hotfix/*"      # Tự động trigger CI khi push lên các nhánh sửa lỗi nhanh
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  # =======================================================
  # 🧪 JOB 1: Continuous Integration (CI) - Chạy cho TẤT CẢ các nhánh (Để test chất lượng code)
  # =======================================================
  build-and-test:
    name: 🧪 Build & Test (.NET 8.0)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 📦 Restore NuGet packages
      run: dotnet restore VClosetSolution.sln

    - name: 🔨 Build Solution (Release Mode)
      run: dotnet build VClosetSolution.sln --configuration Release --no-restore

    - name: 🧪 Run Unit Tests
      run: dotnet test VClosetSolution.sln --configuration Release --no-build --verbosity normal

  # =======================================================
  # 🚀 JOB 2: Continuous Deployment (CD) - DEPLOY TO VIETTEL VPS
  # =======================================================
  deploy-to-viettel:
    name: 🚀 Deploy to Viettel VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    # CHỈ kích hoạt deploy khi push vào nhánh main hoặc master
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd V-ClosetProject
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh

