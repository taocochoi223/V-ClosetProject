name: 🚀 V-Closet Git-Flow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/*"     # Tự động trigger CI khi thành viên push lên nhánh riêng
      - "hotfix/*"      # Tự động trigger CI khi push lên các nhánh sửa lỗi nhanh
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  # =======================================================
  # 🧪 JOB 1: Continuous Integration (CI) - Chạy cho TẤT CẢ các nhánh (Để test chất lượng code)
  # =======================================================
  build-and-test:
    name: 🧪 Build & Test (.NET 8.0)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 📦 Restore NuGet packages
      run: dotnet restore VClosetSolution.sln

    - name: 🔨 Build Solution (Release Mode)
      run: dotnet build VClosetSolution.sln --configuration Release --no-restore

    - name: 🧪 Run Unit Tests
      run: dotnet test VClosetSolution.sln --configuration Release --no-build --verbosity normal

  # =======================================================
  # 🐳 JOB 2: Continuous Deployment (CD) - CHỈ DEPLOY PRODUCTION KHI MERGE VÀO MAIN/MASTER
  # =======================================================
  docker-build-and-push:
    name: 🐳 Dockerize & Deploy Production
    needs: build-and-test
    runs-on: ubuntu-latest
    # CHỈ kích hoạt deploy khi có sự kiện PUSH trực tiếp vào nhánh MAIN hoặc MASTER
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    # Nạp Secrets vào biến môi trường Job-level để bảo mật và sử dụng hợp lệ trong câu lệnh IF
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Đăng nhập vào Docker Hub sử dụng Secrets bảo mật của GitHub (Chỉ chạy nếu có cấu hình tài khoản)
    - name: 🔑 Log in to Docker Hub
      if: env.DOCKER_USER != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🚀 Build and Push Production Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: VCloset.API/Dockerfile
        # Chỉ thực hiện push lên Docker Hub khi đã cấu hình GitHub Secrets
        push: ${{ env.DOCKER_USER != '' }}
        # Gắn nhãn thông minh dựa trên biến môi trường DOCKER_USER
        tags: |
          ${{ env.DOCKER_USER != '' && format('{0}/vcloset-api:latest', env.DOCKER_USER) || 'vcloset-api:latest' }}
          ${{ env.DOCKER_USER != '' && format('{0}/vcloset-api:{1}', env.DOCKER_USER, github.sha) || format('vcloset-api:{0}', github.sha) }}
