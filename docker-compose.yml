version: '3.8'

services:
  # ====================================================
  # 🗄️ PostgreSQL Database — KHÔNG bao giờ restart khi deploy
  # ====================================================
  db:
    image: postgres:16-alpine
    container_name: vcloset-db-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: a
      POSTGRES_DB: V-Closet_Version_3.0
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./v_closet_version_3.0.sql:/docker-entrypoint-initdb.d/1-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d V-Closet_Version_3.0"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====================================================
  # 🔵 API Blue — instance 1
  # ====================================================
  api-blue:
    image: vcloset-api:blue
    container_name: vcloset-api-blue
    build:
      context: .
      dockerfile: VCloset.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8080"       # Không expose ra host, chỉ nội bộ docker network
    volumes:
      - ./uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ====================================================
  # 🟢 API Green — instance 2
  # ====================================================
  api-green:
    image: vcloset-api:green
    container_name: vcloset-api-green
    build:
      context: .
      dockerfile: VCloset.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ====================================================
  # 🌐 Nginx Load Balancer — đứng trước, nhận traffic từ bên ngoài
  # ====================================================
  nginx:
    image: nginx:alpine
    container_name: vcloset-nginx
    restart: always
    ports:
      - "5070:80"    # Host port 5070 → Nginx port 80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-blue

volumes:
  pgdata:
